<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6ebf4">
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
    <title>{{ page.title }}</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("site-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#12151c" : "#e6ebf4");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="site-bg" aria-hidden="true">
        <span class="shape shape-orb"></span>
        <span class="shape shape-glow"></span>
        <span class="shape shape-disc"></span>
        <span class="shape shape-bar"></span>
        <span class="shape shape-ring"></span>
    </div>
    <div class="page">
        <header class="site-header">
            <img class="site-photo" src="{{ '/assets/sankalok.jpg' | relative_url }}" alt="Sankalok Sen" width="400" height="400">
            <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title | default: "blog" }}</a></h1>
            <p class="site-place">Hong Kong</p>
            <nav>
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/blog/blog_base' | relative_url }}" aria-current="page">Blog</a>
                <a href="{{ '/assets/cv.pdf' | relative_url }}">Resume</a>
                <a href="https://github.com/sankalok">Github</a>
                <a href="https://scholar.google.com/citations?user=NlxRNrUAAAAJ&hl=en">Scholar</a>
            </nav>
            <div class="site-tools">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Use dark theme" aria-pressed="false" title="Dark theme">
                    <span class="icon-sun" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                    </span>
                    <span class="icon-moon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M16.5 13.5A7 7 0 1 1 10.5 7.5 5.5 5.5 0 0 0 16.5 13.5z"/></svg>
                    </span>
                </button>
            </div>
        </header>

        <main class="markdown-content">
            {{ content }}
        </main>

        <footer>
            <p>© 2026 • Sankalok Sen • ^_^</p>
        </footer>
    </div>
    <script src="{{ '/assets/js/prefs.js' | relative_url }}"></script>
</body>
</html>
