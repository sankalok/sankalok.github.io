<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e6ebf4">
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
    <title>{{ page.title | default: site.title }}</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("site-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
          var l = localStorage.getItem("site-lang") === "bn" ? "bn" : "en";
          document.documentElement.setAttribute("data-lang", l);
          document.documentElement.setAttribute("lang", l === "bn" ? "bn" : "en");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#12151c" : "#e6ebf4");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="site-bg" aria-hidden="true">
        <span class="shape shape-orb"></span>
        <span class="shape shape-glow"></span>
        <span class="shape shape-disc"></span>
        <span class="shape shape-bar"></span>
        <span class="shape shape-ring"></span>
    </div>
    <div class="page">
        <header class="site-header">
            <img class="site-photo" src="{{ '/assets/sankalok.jpg' | relative_url }}" alt="Sankalok Sen" width="400" height="400">
            <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title | default: "My Blog" }}</a></h1>
            <p class="site-place" data-i18n="place">Hong Kong</p>
            <nav>
                <a href="{{ '/' | relative_url }}" aria-current="page" data-i18n="home">Home</a>
                <!-- <a href="{{ '/blog/blog_base' | relative_url }}" data-i18n="blog">Blog</a> -->
                <!-- <a href="{{ '/assets/cv.pdf' | relative_url }}" data-i18n="resume">Resume</a> -->
                <a href="https://github.com/sankalok">Github</a>
                <a href="https://scholar.google.com/citations?user=NlxRNrUAAAAJ&hl=en" data-i18n="scholar">Scholar</a>
            </nav>
            <div class="site-tools">
                <button type="button" class="tool-btn" id="lang-toggle" aria-label="Switch to Bengali" aria-pressed="false">
                    <span class="flag flag-gb" aria-hidden="true">
                        <svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="40" fill="#012169"/><path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0l60 40M60 0L0 40" stroke="#c8102e" stroke-width="5"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="13"/><path d="M30 0v40M0 20h60" stroke="#c8102e" stroke-width="8"/></svg>
                    </span>
                    <span class="flag flag-bd" aria-hidden="true">
                        <svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="40" fill="#006a4e"/><circle cx="26" cy="20" r="11" fill="#f42a41"/></svg>
                    </span>
                </button>
                <button type="button" class="tool-btn" id="theme-toggle" aria-label="Use dark theme" aria-pressed="false">
                    <span class="icon-sun" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                    </span>
                    <span class="icon-moon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16.5 13.5A7 7 0 1 1 10.5 7.5 5.5 5.5 0 0 0 16.5 13.5z"/></svg>
                    </span>
                </button>
            </div>
        </header>

        <main class="markdown-content">
            {{ content }}
        </main>

        <footer>
            <p>© 2026 • Sankalok Sen • ^_^</p>
        </footer>
    </div>
    <script src="{{ '/assets/js/prefs.js' | relative_url }}"></script>
</body>
</html>
